<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>華語生詞練習</title><link rel="stylesheet" href="style.css?v=0.3.11"></head><body><header><div class="inner"><h1>華語生詞練習</h1><div class="sub">Flash Card → 詞義配對 → 無選項句子填空</div></div></header><main><section><div class="grid"><div><label>選擇課程</label><select id="course"></select></div><div><label>詞義語言</label><select id="language"><option value="en">英文 English</option><option value="vi">越南文 Tiếng Việt</option><option value="id">印尼文 Bahasa Indonesia</option></select></div><div><label>匿名學生代碼</label><input id="student" autocomplete="off" placeholder="例如 S001"></div><div><label>學生 PIN（Supabase 驗證使用）</label><input id="pin" type="password" autocomplete="off" placeholder="課堂取得的專用 PIN"></div><div><label>練習模式</label><select id="mode"><option value="practice">每日練習（達標才完成）</option><option value="delayed">第二週延宕測驗</option></select></div></div><div id="previewChoose" hidden><label>直接預覽階段</label><select id="previewStage"><option value="0">字卡</option><option value="1">多卡片詞義配對</option><option value="2">句子填空</option></select></div><div class="row"><button id="start">開始</button><button id="changePassword" class="secondary">修改密碼</button><span class="hint" id="sync"></span></div></section><section id="workspace" class="hidden"><div class="row"><span class="pill" id="stepLabel"></span><span class="hint" id="courseTitle"></span></div><div class="bar"><div id="progress"></div></div><div id="screen"></div><div id="notice" class="result"></div></section><section id="researchDetails"><details><summary>資料保存與研究說明</summary><p class="small">本網站不將學生姓名放入教材檔；事件會先保留在瀏覽器暫存待送佇列，Supabase 回傳確認才移除。每次練習有獨立 sessionId，個別事件具有事件 ID。待送資料不含 PIN；重新載入後須輸入原學生代碼與 PIN 才能重送。延宕測驗只保存第一次正式交卷。原型需完成學校研究倫理與測試後正式使用。</p><button id="retry" class="secondary">重送尚未確認資料</button><button id="downloadLog" class="secondary">下載本機備援事件</button><div id="pending" class="small"></div></details></section></main><dialog id="passwordDialog"><h2>學生修改密碼</h2><form id="passwordForm"><p><label>學號<input id="passwordStudent" name="studentCode" autocomplete="username" required></label></p><p><label>原密碼<input name="pin" type="password" autocomplete="current-password" required></label></p><p><label>新密碼<input name="newPassword" type="password" autocomplete="new-password" required></label></p><p><label>確認新密碼<input name="confirmation" type="password" autocomplete="new-password" required></label></p><p id="passwordMessage" role="status"></p><button id="savePassword">更新密碼</button><button id="closePassword" type="button" class="secondary">關閉</button></form></dialog><dialog id="delayedDialog"><h2>第二週延宕測驗</h2><form id="delayedForm"><p id="delayedNote" role="status"></p><div id="delayedItems"></div><button id="delayedSubmit">正式交卷</button><button type="button" id="delayedClose" class="secondary">關閉</button></form></dialog><script src="app.js?v=0.3.11-supabase-accounts"></script></body></html>
